name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile

      # src/gen is not committed; buf clones the private happy-cli-go protos.
      - uses: ./.github/actions/generate
        with:
          token: ${{ secrets.HAPPY_CLI_GO_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Visual snapshots of key screens against the mocked server; also
      # published at <pages>/screenshots/ by the Pages workflow.
      - run: pnpm screenshots
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Screenshot summary
        if: always()
        run: |
          echo "### UI screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`screenshots\` artifact, or see https://happyw.denv.it/screenshots/ after the Pages deploy." >> "$GITHUB_STEP_SUMMARY"
          ls screenshots/*.png 2>/dev/null | sed 's#^#- #' >> "$GITHUB_STEP_SUMMARY" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
