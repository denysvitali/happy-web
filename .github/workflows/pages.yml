name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy with the fresh gallery once screenshots for main are done.
  workflow_run:
    workflows: [Screenshots]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip redeploys for failed screenshot runs; push deploys never wait.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/generate
        with:
          token: ${{ secrets.HAPPY_CLI_GO_TOKEN }}
      # Repository variables (all optional):
      #   HAPPY_SERVER_URL  default server (https://...)
      #   PAGES_BASE        URL base path; "/" for a custom domain (the default,
      #                     served at https://happyw.denv.it), "/<repo>/" for
      #                     <owner>.github.io/<repo>/
      #   PAGES_CNAME       custom domain written to dist/CNAME
      # Best effort: the gallery from the triggering Screenshots run, else
      # the latest successful one on main (may lag a commit behind).
      - name: Fetch screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          id="${RUN_ID:-$(gh run list -R "$GITHUB_REPOSITORY" -w screenshots.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')}"
          [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n screenshots -D screenshots
      - name: Build
        env:
          VITE_HAPPY_SERVER_URL: ${{ vars.HAPPY_SERVER_URL }}
          HAPPY_WEB_BASE: ${{ vars.PAGES_BASE || '/' }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          pnpm build
          if [ -d screenshots ]; then cp -r screenshots dist/screenshots; fi
          if [ -n "$PAGES_CNAME" ]; then printf '%s\n' "$PAGES_CNAME" > dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
