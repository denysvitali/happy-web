name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      # Repository variables (all optional):
      #   HAPPY_SERVER_URL  default server (https://...)
      #   PAGES_BASE        URL base path; "/" for a custom domain (the default,
      #                     served at https://happyw.denv.it), "/<repo>/" for
      #                     <owner>.github.io/<repo>/
      #   PAGES_CNAME       custom domain written to dist/CNAME
      - name: Build
        env:
          VITE_HAPPY_SERVER_URL: ${{ vars.HAPPY_SERVER_URL }}
          HAPPY_WEB_BASE: ${{ vars.PAGES_BASE || '/' }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          pnpm build
          if [ -n "$PAGES_CNAME" ]; then printf '%s\n' "$PAGES_CNAME" > dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
